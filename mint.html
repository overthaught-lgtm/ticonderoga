<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TICONDEROGA · NFT NODE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #060606; }
input::placeholder { color: #333; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const G="#C9A94A",DARK="#060606",PANEL="#0e0e0e",BORDER="#1a1a1a",DIM="#333",MUTED="#555",TEXT="#ccc",GREEN="#4CAF50",BLUE="#4fc3f7",PURPLE="#ab47bc",RED="#ef9a9a";
const HELP=["Commands:","  /wallet            connect wallet","  /mint resume       mint resume NFT","  /mint credential   mint skill credential","  /mint identity     mint identity token","  /registry          view identity registry","  /status            system status","  /clear             clear terminal"];
const MINT_FLOWS={resume:{label:"Resume NFT",color:G,fields:["Full Name","Title / Role","Top Skill","Location"],steps:["Normalizing profile data...","Generating metadata schema...","Computing identity hash...","Signing payload...","Pushing to registry...","Minting NFT artifact..."]},credential:{label:"Skill Credential",color:BLUE,fields:["Full Name","Credential Type","Issuing Org","Skill Level"],steps:["Validating credential schema...","Encoding attestation payload...","Generating proof hash...","Signing with issuer key...","Writing to identity registry...","Minting credential NFT..."]},identity:{label:"Identity Token",color:PURPLE,fields:["Full Name","Primary Handle","Wallet Address","Region"],steps:["Resolving identity graph...","Binding wallet to identity...","Generating sovereign hash...","Signing identity payload...","Registering in registry...","Minting identity token..."]}};
function randHex(){return Array.from({length:16},()=>Math.floor(Math.random()*16).toString(16)).join("");}
function randId(){return String(Math.floor(Math.random()*9000+1000));}

function MintForm({type,onDone,onCancel}){const flow=MINT_FLOWS[type];const[phase,setPhase]=React.useState("form");const[vals,setVals]=React.useState(["","","",""]);const[stepIdx,setStepIdx]=React.useState(0);function startMint(){setPhase("minting");let i=0;const iv=setInterval(()=>{i++;setStepIdx(i);if(i>=flow.steps.length){clearInterval(iv);setTimeout(()=>setPhase("done"),300);}},380);}const statusWord=type==="resume"?"MINTED":type==="credential"?"ATTESTED":"SOVEREIGN";if(phase==="form")return(<div style={{padding:"12px 0"}}><div style={{fontSize:10,color:flow.color,letterSpacing:"0.12em",marginBottom:14}}>/mint {type} — {flow.label}</div>{flow.fields.map((f,i)=>(<div key={i} style={{marginBottom:10}}><div style={{fontSize:9,color:MUTED,marginBottom:3}}>{f}</div><input value={vals[i]} onChange={e=>setVals(v=>v.map((x,j)=>j===i?e.target.value:x))} placeholder={"Enter "+f.toLowerCase()+"..."} style={{width:"100%",background:PANEL,border:"1px solid "+BORDER,borderRadius:3,padding:"7px 10px",color:TEXT,fontFamily:"monospace",fontSize:11,outline:"none",boxSizing:"border-box"}}/></div>))}<div style={{display:"flex",gap:8,marginTop:14}}><button onClick={startMint} style={{background:"transparent",border:"1px solid "+flow.color,borderRadius:3,padding:"6px 14px",color:flow.color,fontFamily:"monospace",fontSize:10,cursor:"pointer"}}>MINT</button><button onClick={onCancel} style={{background:"transparent",border:"1px solid "+BORDER,borderRadius:3,padding:"6px 14px",color:MUTED,fontFamily:"monospace",fontSize:10,cursor:"pointer"}}>CANCEL</button></div></div>);
if(phase==="minting")return(<div style={{padding:"12px 0"}}><div style={{fontSize:10,color:flow.color,marginBottom:12}}>Minting...</div>{flow.steps.map((s,i)=>(<div key={i} style={{fontSize:10,color:i<stepIdx?TEXT:DIM,padding:"2px 0",display:"flex",gap:8}}><span style={{color:i<stepIdx?GREEN:DIM}}>{i<stepIdx?"✓":"·"}</span>{s}</div>))}</div>);
const tokenId=randId();const hash=randHex();return(<div style={{padding:"12px 0"}}><div style={{fontSize:10,color:GREEN,marginBottom:10}}>MINT COMPLETE</div><div style={{fontFamily:"monospace",fontSize:10,lineHeight:1.9,color:TEXT}}><div style={{color:DIM}}>─────────────────────────────</div><div>  Asset:    {flow.label}</div><div>  Name:     {vals[0]||"Anonymous"}</div><div>  Field 2:  {vals[1]||"—"}</div><div>  Field 3:  {vals[2]||"—"}</div><div>  Field 4:  {vals[3]||"—"}</div><div>  Token ID: #{tokenId}</div><div>  Hash:     0x{hash}...</div><div>  Chain:    Base Sepolia (testnet)</div><div style={{color:GREEN}}>  Status:   {statusWord}</div><div style={{color:DIM}}>─────────────────────────────</div></div><button onClick={onDone} style={{marginTop:10,background:"transparent",border:"1px solid "+GREEN,borderRadius:3,padding:"6px 14px",color:GREEN,fontFamily:"monospace",fontSize:10,cursor:"pointer"}}>DONE</button></div>);}

function MintConsole(){const[lines,setLines]=React.useState([{t:"TICONDEROGA SYSTEMS · NFT IDENTITY NODE",c:G},{t:"nft.ticonderogasystems.xyz",c:MUTED},{t:"────────────────────────────────────────",c:DIM},{t:"Mint console ready. Type /help for commands.",c:TEXT},{t:"",c:TEXT}]);const[input,setInput]=React.useState("");const[mintType,setMintType]=React.useState(null);const[wallet,setWallet]=React.useState(false);const bottomRef=React.useRef(null);const inputRef=React.useRef(null);React.useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[lines,mintType]);function push(arr,color){const safe=(arr||[]).map(t=>({t:String(t||""),c:color||TEXT}));setLines(prev=>[...prev,...safe]);}function run(raw){const cmd=(raw||"").trim().toLowerCase();if(!cmd)return;setLines(prev=>[...prev,{t:"› "+raw.trim(),c:G}]);setInput("");if(cmd==="/clear"){setLines([]);return;}if(cmd==="/help"){push(HELP);push([""]);return;}if(cmd==="/wallet"){setWallet(true);push(["Wallet Connect","  Provider:  MetaMask","  Address:   0x47e1...9f3a","  Network:   Base Sepolia","  Balance:   0.042 ETH","  Status:    connected (testnet)",""]);return;}if(cmd==="/status"){push(["System Status","  Chain:    Base Sepolia","  Registry: online","  Wallet:   "+(wallet?"connected":"not connected"),"  Mode:     testnet",""]);return;}if(cmd==="/registry"){push(["Identity Registry","  user_id: usr_0x47e1","  wallet:  0x47e1...9f3a","  assets:  0 minted","  Run /mint to create your first artifact.",""]);return;}if(cmd.startsWith("/mint ")){const t=cmd.split(" ")[1];if(MINT_FLOWS[t]){setMintType(t);return;}push(["Unknown: "+t,"Try: /mint resume | credential | identity",""],RED);return;}push(["Not found: "+cmd,"Type /help for commands.",""],RED);}
return(<div style={{background:DARK,minHeight:"100vh",display:"flex",flexDirection:"column",fontFamily:"monospace"}}><div style={{borderBottom:"1px solid "+BORDER,padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:11,color:G,letterSpacing:"0.15em"}}>TICONDEROGA · NFT NODE</span><div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:6,height:6,borderRadius:"50%",background:wallet?GREEN:DIM}}/><span style={{fontSize:9,color:wallet?GREEN:MUTED}}>{wallet?"WALLET ON":"NO WALLET"}</span></div></div><div style={{padding:"8px 16px",borderBottom:"1px solid "+BORDER,display:"flex",gap:6,flexWrap:"wrap"}}>{[["/wallet","Wallet",G],["/mint resume","Resume NFT",G],["/mint credential","Credential",BLUE],["/mint identity","Identity",PURPLE],["/registry","Registry",TEXT],["/status","Status",TEXT]].map(([cmd,label,color])=>(<button key={cmd} onClick={()=>run(cmd)} style={{background:"transparent",border:"1px solid "+BORDER,borderRadius:3,padding:"4px 9px",color:color===TEXT?MUTED:color,fontFamily:"monospace",fontSize:9,cursor:"pointer"}}>{label}</button>))}</div><div onClick={()=>inputRef.current?.focus()} style={{flex:1,overflowY:"auto",padding:"16px",cursor:"text"}}>{lines.map((l,i)=>(<div key={i} style={{fontSize:11,lineHeight:1.8,color:l.c,whiteSpace:"pre-wrap"}}>{l.t}</div>))}{mintType&&(<MintForm type={mintType} onDone={()=>{setMintType(null);push(["Mint complete.",""]);}} onCancel={()=>{setMintType(null);push(["Cancelled.",""],MUTED);}}/>)}<div ref={bottomRef}/></div>{!mintType&&(<div style={{borderTop:"1px solid "+BORDER,padding:"10px 16px",display:"flex",alignItems:"center",gap:8,background:PANEL}}><span style={{color:G}}>›</span><input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&run(input)} placeholder="type a command..." autoFocus style={{flex:1,background:"transparent",border:"none",color:TEXT,fontFamily:"monospace",fontSize:11,outline:"none"}}/>{input.trim()&&(<button onClick={()=>run(input)} style={{background:"transparent",border:"1px solid "+G,borderRadius:3,padding:"3px 10px",color:G,fontFamily:"monospace",fontSize:9,cursor:"pointer"}}>RUN</button>)}</div>)}<div style={{borderTop:"1px solid "+BORDER,padding:"5px 16px",display:"flex",justifyContent:"space-between"}}><span style={{fontSize:8,color:"#222"}}>nft.ticonderogasystems.xyz</span><span style={{fontSize:8,color:"#222"}}>TEAKWOOD · testnet</span></div></div>);}

ReactDOM.render(<MintConsole/>, document.getElementById('root'));
</script>
</body>
</html>
